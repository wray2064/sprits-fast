name: ci

# Fast is built against the engine from source, checked out beside it from its
# own repository; LIVESPRITE_DIR points the build at where that lands.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "windows / msvc",      os: windows-latest, args: "" }
          - { name: "ubuntu / gcc",        os: ubuntu-latest,
              args: "-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++" }
          - { name: "macos / apple clang", os: macos-latest, args: "" }

    steps:
      - name: Check out Fast
        uses: actions/checkout@v4
        with:
          path: fast

      # The engine lives in its own public repository, so the default token can
      # read it. LIVESPRITE_REPO is a repository variable so a fork can point at
      # its own engine; LIVESPRITE_REF pins a branch or tag if one is wanted.
      # If the engine ever goes private again, add `token:` here with a PAT
      # that can read it -- the default GITHUB_TOKEN cannot see a private
      # sibling.
      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.LIVESPRITE_REPO }}
          ref: ${{ vars.LIVESPRITE_REF || 'main' }}
          path: engine

      # Said plainly rather than left to fail thirty lines later inside CMake
      # complaining about a missing header.
      - name: Check the engine is there
        shell: bash
        run: |
          if [ ! -f engine/CMakeLists.txt ]; then
            echo "The engine was not checked out."
            echo "Set the repository variable LIVESPRITE_REPO to owner/name."
            exit 1
          fi

      - name: Configure
        working-directory: fast
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLIVESPRITE_DIR=../engine ${{ matrix.args }}

      - name: Build
        working-directory: fast
        run: cmake --build build --config RelWithDebInfo

      - name: Test
        working-directory: fast
        run: ctest --test-dir build --build-config RelWithDebInfo --output-on-failure

  # The editor itself. Separate from the core job because it fetches and builds
  # SDL3, which is slow, and because a broken core should fail before this does.
  gui:
    name: the editor builds and starts
    runs-on: ubuntu-latest
    steps:
      - name: Check out Fast
        uses: actions/checkout@v4
        with:
          path: fast

      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.LIVESPRITE_REPO }}
          ref: ${{ vars.LIVESPRITE_REF || 'main' }}
          path: engine

      - name: Install SDL build dependencies
        run: |
          sudo apt-get update
          # SDL3 refuses to configure without the X11 extension packages it
          # was told to use, rather than quietly building without them.
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Build
        working-directory: fast
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DLIVESPRITE_DIR=../engine -DFAST_BUILD_GUI=ON
          cmake --build build

      # No display on a CI runner, so SDL's dummy driver stands in. This proves
      # the whole stack comes up and draws a frame.
      - name: Start it
        working-directory: fast
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          # Enough frames for the strip to settle, then a check that a
          # settled editor compiles nothing at all.
          # It also writes a sheet, so the compile-every-frame-and-compose path
          # is walked by something other than its own unit tests.
          ./build/sprits_fast --frames 30 --demo-stroke --expect-idle --sheet "$RUNNER_TEMP/ci-sheet.png"
          ./build/sprits_fast --self-test
